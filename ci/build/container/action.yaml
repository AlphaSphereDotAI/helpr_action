name: Container Image
description: Build and push the container image to a registry
inputs:
  is_test:
    required: true
    description: Test Mode
  registry:
    required: true
    description: Registry
  install_source:
    required: true
    description: Source to install from (e.g., PyPI Package or Git source)
  github_token:
    required: false
    description: GitHub Token
    default: ${{ github.token }}
  github_source_repository:
    required: true
    description: GitHub Source Repository
  docker_token:
    required: false
    description: Docker Registry Token
  image_name:
    required: true
    description: Image Name (e.g., my-image)
outputs:
  image_tag:
    description: The built image tag
    value: ${{ steps.tag.outputs.TAG }}
  image_digest:
    description: The built image digest
    value: ${{ steps.build_and_publish.outputs.digest }}
runs:
  using: composite
  steps:
    # build_image
    - name: Get Python version
      uses: dagger/dagger-for-github@v8.2.0
      id: get_python_version
      with:
        args: >-
          get-python-version --src ${{ inputs.github_source_repository }}
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    - name: Build and Push Image
      id: build_and_publish
      uses: dagger/dagger-for-github@v8.2.0
      with:
        args: >-
          build-and-publish --github-ref ${{ github.ref }} --image-name ${{ inputs.image_name }} --image-registry ${{ inputs.registry }} --src ${{ inputs.github_source_repository }} --build-args INSTALL_SOURCE=${{ inputs.install_source }} --build-args PYTHON_VERSION=${{ steps.get_python_version.outputs.output }}
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
      if: ${{ inputs.is_test == false }}
      with:
        subject-name: >-
          ${{inputs.registry == 'docker.io' && 'index.docker.io' || inputs.registry}}/${{github.repository}}
        subject-digest: ${{ steps.build_and_publish.outputs.digest }}
        push-to-registry: true
    - name: Update Docker Hub Description
      if: ${{ inputs.registry == 'docker.io' }}
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      with:
        username: mh0386
        password: ${{ inputs.docker_token }}
        repository: ${{ github.repository }}
        short-description: ${{ github.event.repository.description }}
        enable-url-completion: true
    - name: Export tag for Testing and Scanning
      id: tag
      shell: bash
      run: echo "TAG=$(echo "${{ steps.build_and_publish.outputs.output }}" | tail -n 1)" >> $GITHUB_OUTPUT
