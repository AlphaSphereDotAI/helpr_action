name: Container Image
description: Build and push the container image to a registry
inputs:
  is_test:
    required: true
    description: Test Mode
  registry:
    required: true
    description: Registry
  install_source:
    required: true
    description: Source to install from (e.g., PyPI Package or Git source)
  github_token:
    required: false
    description: GitHub Token
    default: ${{ github.token }}
  docker_token:
    required: false
    description: Docker Registry Token
outputs:
  image_tag:
    description: The built image tag
    value: ${{ steps.tag.outputs.TAG }}
  image_digest:
    description: The built image digest
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    # check_dockerfile
    - name: Check Dockerfile
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      id: dockerfile_lint
      with:
        call: check
    - name: Job Summary
      uses: jazanne/job-summary-action@690eb386a0b86fe4da7c6f0e543e61330ff09f06 # v1.0.0
      if: success() || failure()
      with:
        summary: |
          ## Dockerfile Check
          - **Status**: ${{ steps.dockerfile_lint.outcome == 'success' && ':white_check_mark:' || ':x:' }}
    # build_image
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
      if: ${{ steps.dockerfile_lint.outcome == 'success' }}
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages_one_command: true
        rm_cmd: rmz
        remove_folders: /usr/share /usr/local
    - name: Get Python version from pyproject.toml
      id: get_python_version
      run: echo "result=$(uv version --short)" >> $GITHUB_OUTPUT
      shell: bash
    - name: Log in to ${{ inputs.registry }} Registry
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
      with:
        registry: ${{ inputs.registry }}
        username: mh0386
        password: >-
          ${{ inputs.registry == 'ghcr.io' && inputs.github_token || inputs.registry
          == 'docker.io' && inputs.docker_token }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      with:
        images: ${{ inputs.registry }}/${{ github.repository }}
        tags: |
          type=raw,value=latest,enable=${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') }}
          type=ref,event=pr,prefix={{sha}}-pr-
          type=ref,event=tag
          type=ref,event=branch
    - name: Build and Push to ${{ inputs.registry }}
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      id: push
      with:
        push: true
        sbom: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: |
          INSTALL_SOURCE=${{ inputs.install_source }}
          PYTHON_VERSION=${{ steps.get_python_version.outputs.result }}
      env:
        DOCKER_CONTENT_TRUST: "1"
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      if: ${{ inputs.is_test == false }}
      with:
        subject-name: >-
          ${{inputs.registry == 'docker.io' && 'index.docker.io' || inputs.registry}}/${{github.repository}}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
    - name: Update Docker Hub Description
      if: ${{ inputs.registry == 'docker.io' }}
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      with:
        username: mh0386
        password: ${{ inputs.docker_token }}
        repository: ${{ github.repository }}
        short-description: ${{ github.event.repository.description }}
        enable-url-completion: true
    - name: Export tag for Testing and Scanning
      id: tag
      shell: bash
      run: echo "TAG=$(echo "${{ steps.meta.outputs.tags }}" | tail -n 1)" >> $GITHUB_OUTPUT
