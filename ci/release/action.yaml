name: Release
description: Publish Release
inputs:
  tag_name:
    description: Tag name to release
    required: true
  packages_dir:
    description: Directory containing packages to publish
    required: false
    default: "dist/"
  registry:
    description: Registry to publish to
    required: true
runs:
  using: composite
  steps:
    - name: Publish release distributions to PyPI
      uses: AlphaSphereDotAI/helpr_action/ci/release/pypi@65d0bf6d409dd1e02bfb34663e7d1c7825c6b58f # v0.0.60
      if: ${{ inputs.registry == 'pypi' }}
      with:
        tag_name: ${{ inputs.tag_name }}
        packages_dir: ${{ inputs.packages_dir }}
