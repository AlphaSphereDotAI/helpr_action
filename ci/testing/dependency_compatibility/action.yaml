name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@f7013dd2c4acd88269c129c07d1ea92ad00b01d9 # v0.0.70
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
