name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@e7065fffa37c4b43e02d091c47b7d313d8c63478 # v0.0.72
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
