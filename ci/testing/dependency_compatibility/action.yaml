name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@22789c0666c7e9f8d36f39a25a091cd4f2e29dd9 # v0.0.72
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
