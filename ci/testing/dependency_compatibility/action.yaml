name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@b6eecd6675616d3bef4e3e1691c86567e927ce01 # v0.0.69
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
