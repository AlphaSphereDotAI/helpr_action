name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@2f8ea0838cb2ec2d07c2fbaa9c52e6d8aebca7f0 # v0.0.72
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
