name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@c41f4494d4904ad3133c4feb9499be0baa8c565d # v0.0.73
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
