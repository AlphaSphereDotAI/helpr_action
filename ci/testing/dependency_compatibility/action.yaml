name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@c42a5ad6556f12bacf544400f05e8540ac866391 # v0.0.68
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
