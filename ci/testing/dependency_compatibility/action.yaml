name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@06e8bd9e7d2f3c64be28accdc763d17db2ee785c # v0.0.66
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
