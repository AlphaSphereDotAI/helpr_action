name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@406d2689f26da731dd51c56cb330ff1e02fcdff0 # v0.0.16
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
