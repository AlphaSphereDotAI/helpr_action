name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@f33b8aa9d172c6311eb5b220e71d3df6c112e0ab # v0.0.72
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
