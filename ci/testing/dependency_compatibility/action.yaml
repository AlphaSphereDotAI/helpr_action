name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@7d48d21008ee304929b842b7ca9062ba9a19ade3 # v0.0.68
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
