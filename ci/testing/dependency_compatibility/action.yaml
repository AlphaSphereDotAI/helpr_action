name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@5c1757ecf44e9347cbc05d94ce28033b493b4c09 # v0.0.67
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
