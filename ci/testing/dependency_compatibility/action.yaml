name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@796c44d9aaecdfadc8b8d0f01e9d3a3186fd3e70 # v0.0.65
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
