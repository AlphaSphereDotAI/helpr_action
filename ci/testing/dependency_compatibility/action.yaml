name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@8e21bfe2f4beb54397dda05c1daf143f1c1461ed # v0.0.64
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
