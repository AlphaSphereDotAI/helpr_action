name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@d8fd85606b78705110f2a6fac87909177370b0a2 # v0.0.71
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
