name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@d883ae2685674640e14316ad94fc919424d9fa4a # v0.0.65
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
