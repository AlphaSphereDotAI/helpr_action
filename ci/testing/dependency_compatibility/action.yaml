name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@a9f70d8e5f15243c8c9994784e6f4e2a409c2d9a # v0.0.63
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
