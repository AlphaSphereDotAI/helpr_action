name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@ad04cd639e661aaa805491b9ca3da6ece29a8459 # v0.0.65
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
