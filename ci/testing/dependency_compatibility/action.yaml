name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@ae3ff5b0c2ac6f9b2ab0d12d5b2d4f8e59033922 # v0.0.65
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
