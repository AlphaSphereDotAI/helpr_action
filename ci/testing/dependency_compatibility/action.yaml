name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@71e7e8bd33fdc93c367f244fcbddb2e86c528be4 # v0.0.67
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
