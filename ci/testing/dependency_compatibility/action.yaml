name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@e6c1d180dc63565a9420c1a09f9b05892ae92614 # v0.0.65
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
