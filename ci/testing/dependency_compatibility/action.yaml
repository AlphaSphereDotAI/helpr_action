name: Dependency Compatibility Test
description: Test the project dependency compatibility
inputs:
  tool:
    description: Tool to use for dependency compatibility check
    required: true
  shell:
    description: Shell to use
    default: bash
runs:
  using: composite
  steps:
    - name: Test Dependency Compatibility
      uses: AlphaSphereDotAI/helpr_action/ci/testing/dependency_compatibility/uv@ce254f8c456ab7a3d08cd8fe36b624b6c193d329 # v0.0.66
      if: ${{ inputs.tool == 'uv' }}
      with:
        shell: ${{ inputs.shell }}
