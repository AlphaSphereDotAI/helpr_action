name: CI Tools
description: CI utilities like opencode and uv lock sync
inputs:
  opencode_enabled:
    description: Enable opencode tool
    required: false
    default: "false"
  opencode_model:
    description: Opencode model to use
    required: false
    default: "opencode/grok-code"
  opencode_api_key:
    description: Opencode API key
    required: true
  uv_lock_sync_enabled:
    description: Enable uv lock sync
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Opencode
    - name: Run opencode
      uses: AlphaSphereDotAI/helpr_action/ci/tools/opencode@199f8b82a84d5f0c7054d4e32b5eb6fa782be523 # v0.0.62
      if: ${{ inputs.opencode_enabled == 'true' }}
      with:
        opencode_model: ${{ inputs.opencode_model }}
        opencode_api_key: ${{ inputs.opencode_api_key }}
    # UV Lock Sync
    - name: Sync dependencies in uv.lock
      uses: AlphaSphereDotAI/helpr_action/ci/tools/uv_lock@199f8b82a84d5f0c7054d4e32b5eb6fa782be523 # v0.0.62
      if: ${{ inputs.uv_lock_sync_enabled == 'true' }}
