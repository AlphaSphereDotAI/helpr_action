name: CI Tools
description: CI utilities like opencode and uv lock sync
inputs:
  opencode_enabled:
    description: Enable opencode tool
    required: false
    default: "false"
  opencode_model:
    description: Opencode model to use
    required: false
    default: "opencode/grok-code"
  opencode_api_key:
    description: Opencode API key
    required: true
  opencode_agent:
    description: Opencode agent to use
    required: false
  opencode_prompt:
    description: Opencode prompt to use
    required: false
  uv_lock_sync_enabled:
    description: Enable uv lock sync
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Opencode
    - name: Run opencode
      uses: AlphaSphereDotAI/helpr_action/ci/tools/opencode@c41f4494d4904ad3133c4feb9499be0baa8c565d # v0.0.73
      if: ${{ inputs.opencode_enabled == 'true' }}
      with:
        model: ${{ inputs.opencode_model }}
        api_key: ${{ inputs.opencode_api_key }}
        agent: ${{ inputs.opencode_agent }}
        prompt: ${{ inputs.opencode_prompt }}
    # UV Lock Sync
    - name: Sync dependencies in uv.lock
      uses: AlphaSphereDotAI/helpr_action/ci/tools/uv_lock@c41f4494d4904ad3133c4feb9499be0baa8c565d # v0.0.73
      if: ${{ inputs.uv_lock_sync_enabled == 'true' }}
