name: OpenCode Tool
description: Run OpenCode to assist with code generation and improvements
inputs:
  model:
    description: "Model to use"
    required: true
    default: "opencode/big-pickle"
  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent
      from config or 'build' if not found."
    required: false
  prompt:
    description: "Custom prompt to override the default prompt"
    required: false
  api_key:
    description: Opencode API key
    required: true
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Run opencode
      uses: anomalyco/opencode/github@006a05abe8dd6ba5532bd93af77f3ca648cab540 # v1.14.33
      env:
        OPENCODE_API_KEY: ${{ inputs.api_key }}
      with:
        model: ${{ inputs.model }}
        agent: ${{ inputs.agent }}
        prompt: ${{ inputs.prompt }}
