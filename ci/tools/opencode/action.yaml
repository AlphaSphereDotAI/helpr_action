name: OpenCode Tool
description: Run OpenCode to assist with code generation and improvements
inputs:
  model:
    description: "Model to use"
    required: true
    default: "opencode/big-pickle"
  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false
  prompt:
    description: "Custom prompt to override the default prompt"
    required: false
  api_key:
    description: Opencode API key
    required: true
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        persist-credentials: false
    - name: Run opencode
      uses: anomalyco/opencode/github@6314f09c14fdd6a3ab8bedc4f7b7182647551d12 # v1.3.13
      env:
        OPENCODE_API_KEY: ${{ inputs.api_key }}
      with:
        model: ${{ inputs.model }}
        agent: ${{ inputs.agent }}
        prompt: ${{ inputs.prompt }}
