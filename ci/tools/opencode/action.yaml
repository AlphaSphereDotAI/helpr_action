name: OpenCode Tool
description: Run OpenCode to assist with code generation and improvements
inputs:
  opencode_model:
    description: Opencode model to use
    required: false
    default: 'opencode/grok-code'
  opencode_api_key:
    description: Opencode API key
    required: true
runs:
  using: composite
  steps:
    - name: Run opencode
      uses: sst/opencode/github@3b6b3e6fc8a8a4da5798c9f00027e954263a483e # v1.2.2
      env:
        OPENCODE_API_KEY: ${{ inputs.opencode_api_key }}
      with:
        model: ${{ inputs.opencode_model }}
