name: OpenCode Tool
description: Run OpenCode to assist with code generation and improvements
inputs:
  model:
    description: Opencode model to use
    required: false
    default: "opencode/big-pickle"
  api_key:
    description: Opencode API key
    required: true
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.0
      with:
        persist-credentials: false
    - name: Run opencode
      uses: anomalyco/opencode/github@6314f09c14fdd6a3ab8bedc4f7b7182647551d12 # v1.3.13
      env:
        OPENCODE_API_KEY: ${{ inputs.api_key }}
      with:
        model: ${{ inputs.model }}
